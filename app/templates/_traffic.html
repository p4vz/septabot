{% if traffic %}
  <div class="grid gap-2 md:grid-cols-2">
    {% for e in traffic %}
      <div class="pb-2 border-b border-slate-800 last:border-b-0 min-w-0">
        <div class="text-xs font-semibold text-rose-200 break-words">{{ e.roadway or "?" }} {{ e.direction or "" }}</div>
        <div class="text-xs text-slate-300 break-words">{{ e.headline or e.description }}</div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-sm text-slate-500">{{ error or "No traffic events (or 511PA key not configured)" }}</div>
{% endif %}
