<h2 class="font-semibold text-rose-300">Traffic</h2>
{% if traffic %}
  <div class="mt-3 grid gap-2 md:grid-cols-2">
    {% for e in traffic %}
      <div class="pb-2 border-b border-slate-800 last:border-b-0">
        <div class="text-xs font-semibold text-rose-200">{{ e.roadway or "?" }} {{ e.direction or "" }}</div>
        <div class="text-xs text-slate-300">{{ e.headline or e.description }}</div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="mt-3 text-sm text-slate-500">{{ error or "No traffic events (or 511PA key not configured)" }}</div>
{% endif %}
