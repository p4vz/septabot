{% extends "base.html" %}

{% block body %}
<header class="border-b border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-2">
    <div>
      <h1 class="text-xl font-semibold tracking-tight">septabot</h1>
      <p class="text-xs text-slate-400">SEPTA · Weather · Traffic — Philadelphia</p>
    </div>
    <div class="flex gap-2">
      <button
        class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
        onclick="document.querySelectorAll('details.card').forEach(d => d.open = true)"
      >
        Expand all
      </button>
      <button
        class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
        onclick="document.querySelectorAll('details.card').forEach(d => d.open = false)"
      >
        Collapse all
      </button>
      <button
        class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
        onclick="document.body.dispatchEvent(new CustomEvent('refresh-all'))"
      >
        Refresh
      </button>
    </div>
  </div>
</header>

<main id="cards" class="max-w-6xl mx-auto p-4 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
  {% include "_cards.html" %}
</main>

<footer class="max-w-6xl mx-auto px-4 py-6 text-xs text-slate-500">
  Data: SEPTA Open Data · NWS api.weather.gov · 511PA
</footer>
{% endblock %}
