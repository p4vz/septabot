{% if trains %}
  <div class="space-y-1.5">
    {% for t in trains %}
      <div class="flex justify-between gap-2 text-xs border-b border-slate-800 last:border-b-0 pb-1.5 min-w-0">
        <span class="text-slate-200 truncate min-w-0 flex-1">#{{ t.train_number }} · {{ t.line }} → {{ t.destination }}</span>
        <span class="text-emerald-300 shrink-0">{{ t.late_minutes }}m late</span>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-sm text-slate-500">{{ error or "All trains on time" }}</div>
{% endif %}
