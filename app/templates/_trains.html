{% if trains %}
  <div class="space-y-1.5">
    {% for t in trains %}
      <div class="flex justify-between text-xs border-b border-slate-800 last:border-b-0 pb-1.5">
        <span class="text-slate-200">#{{ t.train_number }} · {{ t.line }} → {{ t.destination }}</span>
        <span class="text-emerald-300">{{ t.late_minutes }}m late</span>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-sm text-slate-500">{{ error or "All trains on time" }}</div>
{% endif %}
