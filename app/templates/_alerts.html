<h2 class="font-semibold text-amber-300">SEPTA Alerts</h2>
{% if alerts %}
  <div class="mt-3 space-y-2">
    {% for a in alerts %}
      <div class="pb-2 border-b border-slate-800 last:border-b-0">
        <div class="text-xs font-semibold text-amber-200">{{ a.route_id }} · {{ a.mode }}</div>
        <div class="text-xs text-slate-300">{{ a.current_message or a.advisory_message }}</div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="mt-3 text-sm text-slate-500">{{ error or "No active alerts" }}</div>
{% endif %}
