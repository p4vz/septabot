<h2 class="font-semibold text-fuchsia-300">Bus Detours</h2>
{% if detours %}
  <div class="mt-3 space-y-2">
    {% for d in detours %}
      <div class="pb-2 border-b border-slate-800 last:border-b-0">
        <div class="text-xs font-semibold text-fuchsia-200">Route {{ d.route_id }}</div>
        <div class="text-xs text-slate-300">{{ d.reason or d.current_message }}</div>
        {% if d.start_location or d.end_location %}
          <div class="text-xs text-slate-500">{{ d.start_location }} → {{ d.end_location }}</div>
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="mt-3 text-sm text-slate-500">{{ error or "No detours" }}</div>
{% endif %}
